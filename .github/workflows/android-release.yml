name: Build SS14 Fobos 276

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create GitHub release with this tag (e.g. v1.0.5). Empty = build only, no release.'
        required: false
        default: ''
  push:
    branches:
      - ss14-fobos-276

concurrency:
  group: fobos-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build SS14 Fobos APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout pinned Fobos content
        uses: actions/checkout@v4
        with:
          repository: dead-space-server/space-station-14-fobos
          ref: 94c8636c48eb4d5797a5037f00438917f925337b
          path: space-station-14
          submodules: recursive

      - name: Apply Fobos Android patches
        run: |
          git -C space-station-14/RobustToolbox apply --check ../../patches/fobos-mobile.patch
          git -C space-station-14/RobustToolbox apply ../../patches/fobos-mobile.patch
          git -C space-station-14 apply --check ../patches/fobos-content.patch
          git -C space-station-14 apply ../patches/fobos-content.patch
          python3 scripts/prepare-fobos.py

      - name: Read version
        id: ver
        run: |
          NEW=$(grep -oP '<ApplicationDisplayVersion>\K[^<]+' Content.Android/Content.Android.csproj)
          if ! echo "$NEW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: unexpected DisplayVersion format: $NEW" >&2
            exit 1
          fi
          INPUT_TAG="${{ inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$NEW"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install Build Tools
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq cmake ninja-build autoconf automake libtool

      - name: Cache Native Libraries
        id: cache-natives
        uses: actions/cache@v4
        with:
          path: Content.Android/lib/arm64-v8a
          key: natives-arm64-${{ hashFiles('scripts/build-native-libs.sh') }}

      - name: Build Native Libraries from Source
        if: steps.cache-natives.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build-native-libs.sh
          ./scripts/build-native-libs.sh

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Set up Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > Content.Android/release.keystore
            echo "Keystore restored from secret."
          elif [ -f Content.Android/release.keystore ]; then
            echo "Using repository permanent release.keystore."
          else
            echo "No keystore available; falling back to debug signing."
          fi

      - name: Build SS14 Fobos APK
        run: dotnet build Content.Android/Content.Android.csproj -c Release -p:TargetOS=Android -p:UseSharedCompilation=false
        env:
          AndroidSigningKeyStore: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          AndroidSigningKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_ALIAS || 'ss14mobile' }}
          AndroidSigningKeyPass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEYSTORE_PASSWORD || 'ss14mobile' }}
          AndroidSigningStorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEYSTORE_PASSWORD || 'ss14mobile' }}

      - name: Find Built APK
        id: find_apk
        run: |
          APK_PATH=$(find Content.Android/bin/Release -name "*-Signed.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find Content.Android/bin/Release -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SS14-Fobos-276-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14

