name: Build SS14 Offline Sandbox

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create GitHub release with this tag (e.g. v1.0.5). Empty = build only, no release.'
        required: false
        default: ''
  push:
    branches:
      - ss14-offline-sandbox

concurrency:
  group: fobos-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Offline Sandbox APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore and verify permanent signing key
        env:
          FOBOS_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FOBOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$FOBOS_KEYSTORE_B64" ] || [ -z "$FOBOS_KEY_PASSWORD" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets. Debug signing is disabled."
            exit 1
          fi
          umask 077
          printf '%s' "$FOBOS_KEYSTORE_B64" | base64 --decode > Content.Android/release.keystore
          keytool -exportcert -keystore Content.Android/release.keystore -alias ss14mobile -storepass:env FOBOS_KEY_PASSWORD -file "$RUNNER_TEMP/fobos-signing.der"
          ACTUAL=$(sha256sum "$RUNNER_TEMP/fobos-signing.der" | awk '{print toupper($1)}')
          EXPECTED=$(tr -d '\r\n ' < signing/fobos-certificate.sha256)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate does not match the pinned Fobos certificate."
            exit 1
          fi
          echo "Permanent signing certificate verified: $ACTUAL"

      - name: Checkout pinned Fobos content
        uses: actions/checkout@v4
        with:
          repository: dead-space-server/space-station-14-fobos
          ref: 94c8636c48eb4d5797a5037f00438917f925337b
          path: space-station-14
          submodules: recursive

      - name: Apply Fobos Android patches
        run: |
          git -C space-station-14/RobustToolbox apply --check ../../patches/fobos-mobile.patch
          git -C space-station-14/RobustToolbox apply ../../patches/fobos-mobile.patch
          git -C space-station-14 apply --check ../patches/fobos-content.patch
          git -C space-station-14 apply ../patches/fobos-content.patch
          python3 scripts/prepare-fobos.py
          python3 scripts/prepare-offline.py

      - name: Read version
        id: ver
        run: |
          NEW=$(grep -oP '<ApplicationDisplayVersion>\K[^<]+' Content.Android/Content.Android.csproj)
          if ! echo "$NEW" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: unexpected DisplayVersion format: $NEW" >&2
            exit 1
          fi
          INPUT_TAG="${{ inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v$NEW"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Verify Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install Build Tools
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq cmake ninja-build autoconf automake libtool

      - name: Cache Native Libraries
        id: cache-natives
        uses: actions/cache@v4
        with:
          path: Content.Android/lib/arm64-v8a
          key: natives-arm64-${{ hashFiles('scripts/build-native-libs.sh') }}

      - name: Build Native Libraries from Source
        if: steps.cache-natives.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build-native-libs.sh
          ./scripts/build-native-libs.sh

      - name: Build offline SQLite
        run: bash scripts/build-offline-sqlite.sh

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test server cache transfer
        run: dotnet run --project tests/ServerCacheTransfer/ServerCacheTransfer.csproj

      - name: Test startup progress timeout
        run: dotnet run --project tests/StartupProgress/StartupProgress.csproj

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Build Offline Sandbox APK
        run: dotnet build Content.Android/Content.Android.csproj -c Release -p:TargetOS=Android -p:UseSystemSqlite=True -p:UseSharedCompilation=false -p:AndroidKeyStore=true
        env:
          AndroidSigningKeyStore: ${{ github.workspace }}/Content.Android/release.keystore
          AndroidSigningKeyAlias: ss14mobile
          AndroidSigningKeyPass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AndroidSigningStorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Find Built APK
        id: find_apk
        run: |
          APK_PATH=$(find Content.Android/bin/Release -name "*-Signed.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify bundled ARM64 SQLite
        env:
          APK_PATH: ${{ steps.find_apk.outputs.apk_path }}
        run: |
          python3 scripts/verify-offline-apk.py "$APK_PATH"

      - name: Sign APK with permanent Fobos key
        env:
          APK_PATH: ${{ steps.find_apk.outputs.apk_path }}
          FOBOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" sign --ks Content.Android/release.keystore --ks-key-alias ss14mobile --ks-pass env:FOBOS_KEY_PASSWORD --key-pass env:FOBOS_KEY_PASSWORD "$APK_PATH"

      - name: Verify APK signing certificate
        env:
          APK_PATH: ${{ steps.find_apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH" > "$RUNNER_TEMP/fobos-apk-signature.txt"
          ACTUAL=$(awk -F': ' 'tolower($0) ~ /certificate sha-256 digest:/ {print toupper($NF)}' "$RUNNER_TEMP/fobos-apk-signature.txt" | sort -u)
          EXPECTED=$(tr -d '\r\n ' < signing/fobos-certificate.sha256)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            cat "$RUNNER_TEMP/fobos-apk-signature.txt"
            echo "::error::Built APK has an unexpected signing certificate: $ACTUAL; expected $EXPECTED."
            exit 1
          fi
          echo "APK signature verified: $ACTUAL"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SS14-Offline-Sandbox-${{ steps.ver.outputs.tag }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14


      - name: Remove temporary signing key
        if: always()
        run: rm -f Content.Android/release.keystore "$RUNNER_TEMP/fobos-signing.der"
